name: ai-catalyst-workspace

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: local
      SERVICE_NAME: aicatalyst-api
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql://ai_catalyst:ai_catalyst@db:5432/ai_catalyst
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      APP_ENV: local
      SERVICE_NAME: aicatalyst-web
      DATABASE_URL: postgresql://ai_catalyst:ai_catalyst@db:5432/ai_catalyst
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-http://localhost:${WEB_PORT:-3000}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # Google sign-in. Unset by default and NOT :?-required — lib/auth.ts only
      # reads these when AUTH_GOOGLE_ENABLED is true in
      # apps/web/lib/feature-flags.ts, so requiring them here would break every
      # local stack that has no Google client configured.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Must match the mcp service's own MCP_RESOURCE_URL below exactly —
      # see apps/web/lib/mcp-oauth-compat/hooks.ts.
      MCP_RESOURCE_URL: http://localhost:${MCP_HOST_PORT:-8787}/mcp
      # Shared with mcp via local_storage_data. Local provider is fine for
      # single-process use; prefer S3 (STORAGE_PROVIDER=s3) when web and mcp
      # must share objects across containers.
      LOCAL_STORAGE_ROOT: /data/storage
      GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - local_storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started

  mcp:
    build:
      context: ../..
      dockerfile: apps/mcp/Dockerfile
    environment:
      # Fixed container-internal port. MCP_HOST_PORT (below) is a distinct
      # variable on purpose: templating both the container's own listener
      # and the host-side publish from the same MCP_PORT would break the
      # container's listener the moment a developer overrides it to dodge a
      # host port clash.
      MCP_PORT: 8787
      APP_ENV: local
      SERVICE_NAME: aicatalyst-mcp
      DATABASE_URL: postgresql://ai_catalyst:ai_catalyst@db:5432/ai_catalyst
      # Public-facing URLs only, for OAuth discovery metadata (RFC 9728) —
      # apps/mcp verifies platform Bearer tokens by querying Postgres
      # directly (DATABASE_URL above), never by calling apps/web over HTTP.
      MCP_RESOURCE_URL: http://localhost:${MCP_HOST_PORT:-8787}/mcp
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-http://localhost:${WEB_PORT:-3000}}
      # Same named volume as web — same in-container path for both services.
      LOCAL_STORAGE_ROOT: /data/storage
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8787}:8787"
    volumes:
      - local_storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_catalyst
      POSTGRES_USER: ai_catalyst
      POSTGRES_PASSWORD: ai_catalyst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_catalyst -d ai_catalyst"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Chromium HTML → PDF for printable Interview Guide (and later Verdict/ICA/Roadmap).
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:${GOTENBERG_HOST_PORT:-3001}:3000"

volumes:
  postgres_data:
  # Shared by web and mcp when LOCAL_STORAGE_ROOT=/data/storage. For
  # multi-container object sharing in Staging/Production, use S3 instead.
  local_storage_data:
