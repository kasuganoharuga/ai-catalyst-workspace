name: Deploy to AWS

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Rapid merges on develop used to queue many deploys; with cancel-in-progress
# false, only the in-flight run finished and every other pending run was
# cancelled — noisy red/cancelled noise in Actions. Prefer deploying the
# latest tip only.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest

    # A real GitHub Environment per branch. For production this is the approval
    # gate: configure required reviewers on it and a merge to main waits for a
    # human before touching live infrastructure. Without it, "merge to main"
    # and "deploy to production" are the same irreversible click.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_ACCOUNT_ID: "765332581489"
      AWS_REGION: ap-southeast-2
      AWS_ROLE_ARN: arn:aws:iam::765332581489:role/ai-catalyst-github-actions-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select deployment environment
        shell: bash
        env:
          # Infrastructure ids come from GitHub Actions variables rather than
          # this file: they are created by `terraform apply` and differ per
          # environment, so hardcoding them means the workflow silently targets
          # last month's stack after any rebuild. Print them with
          # `terraform output` and set them once per environment — the names
          # below are scoped by the GitHub Environment above, so `main` reads
          # production's values and `develop` reads staging's.
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          PRIVATE_SUBNET_IDS: ${{ vars.PRIVATE_SUBNET_IDS }}
          ECS_SECURITY_GROUP_ID: ${{ vars.ECS_SECURITY_GROUP_ID }}
          # ENABLED or DISABLED, for the one-off migrate/seed task below.
          # Required rather than defaulted because both answers are wrong
          # somewhere: a task in a private subnet needs DISABLED and reaches ECR
          # through the NAT gateway, while a task in a public subnet needs
          # ENABLED or it cannot pull its image at all. Guessing produces a
          # deploy that hangs on CannotPullContainerError.
          ASSIGN_PUBLIC_IP: ${{ vars.ASSIGN_PUBLIC_IP }}
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            main)
              ENV_NAME=production
              ;;
            develop)
              ENV_NAME=staging
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          # Fail before any AWS call rather than half-deploying against blanks.
          # An empty SUBNETS or SECURITY_GROUP makes `aws ecs run-task` fail
          # with a message that says nothing about the missing variable.
          missing=""
          [ -n "${ECS_CLUSTER}" ] || missing="${missing} ECS_CLUSTER"
          [ -n "${PRIVATE_SUBNET_IDS}" ] || missing="${missing} PRIVATE_SUBNET_IDS"
          [ -n "${ECS_SECURITY_GROUP_ID}" ] || missing="${missing} ECS_SECURITY_GROUP_ID"
          [ -n "${ASSIGN_PUBLIC_IP}" ] || missing="${missing} ASSIGN_PUBLIC_IP"
          if [ -n "${missing}" ]; then
            echo "Missing Actions variables for the ${ENV_NAME} environment:${missing}" >&2
            echo "Set them from \`terraform output\` in infra/aws/terraform/envs/${ENV_NAME}." >&2
            exit 1
          fi

          {
            echo "ENV_NAME=${ENV_NAME}"
            echo "ENV_PREFIX=ai-catalyst-${ENV_NAME}"
            echo "CLUSTER=${ECS_CLUSTER}"
            echo "SUBNETS=${PRIVATE_SUBNET_IDS}"
            echo "SECURITY_GROUP=${ECS_SECURITY_GROUP_ID}"
            echo "ASSIGN_PUBLIC_IP=${ASSIGN_PUBLIC_IP}"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        shell: bash
        env:
          # Browser-side Sentry has to be decided at build time — Next.js inlines
          # NEXT_PUBLIC_* into the client bundle, so unlike SENTRY_DSN (which the
          # task definition supplies to the server) this one cannot be added
          # later. Unset leaves it empty and instrumentation-client.ts skips
          # Sentry.init, so the build works with no repository variable
          # configured.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Same rule for PostHog — see apps/web/lib/analytics/posthog.ts.
          # Staging and production should point at separate PostHog projects
          # (separate repository variables per GitHub Environment) so test
          # traffic never lands in the production project's funnels.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
        run: |
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA}"

          WEB_REPO="${REGISTRY}/${ENV_PREFIX}/web"
          API_REPO="${REGISTRY}/${ENV_PREFIX}/api"
          MCP_REPO="${REGISTRY}/${ENV_PREFIX}/mcp"

          docker build -f apps/web/Dockerfile \
            --build-arg "RELEASE=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_RELEASE=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_APP_ENV=${ENV_NAME}" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}" \
            --build-arg "NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}" \
            --build-arg "NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-}" \
            -t "${WEB_REPO}:${IMAGE_TAG}" -t "${WEB_REPO}:latest" .
          docker build -f apps/api/Dockerfile -t "${API_REPO}:${IMAGE_TAG}" -t "${API_REPO}:latest" .
          docker build -f apps/mcp/Dockerfile \
            --build-arg "RELEASE=${GITHUB_SHA}" \
            -t "${MCP_REPO}:${IMAGE_TAG}" -t "${MCP_REPO}:latest" .

          docker push "${WEB_REPO}:${IMAGE_TAG}"
          docker push "${WEB_REPO}:latest"
          docker push "${API_REPO}:${IMAGE_TAG}"
          docker push "${API_REPO}:latest"
          docker push "${MCP_REPO}:${IMAGE_TAG}"
          docker push "${MCP_REPO}:latest"

          {
            echo "WEB_IMAGE=${WEB_REPO}:${IMAGE_TAG}"
            echo "API_IMAGE=${API_REPO}:${IMAGE_TAG}"
            echo "MCP_IMAGE=${MCP_REPO}:${IMAGE_TAG}"
          } >> "$GITHUB_ENV"

      - name: Register ECS task definitions
        shell: bash
        run: |
          set -euo pipefail

          register_task_definition() {
            local family="$1"
            local container_name="$2"
            local image_uri="$3"
            local current_json
            local next_json

            current_json="$(mktemp)"
            next_json="$(mktemp)"

            aws ecs describe-task-definition \
              --task-definition "${family}" \
              --query taskDefinition \
              --output json > "${current_json}"

            jq \
              --arg container "${container_name}" \
              --arg image "${image_uri}" \
              '
                .containerDefinitions |= map(
                  if .name == $container then .image = $image else . end
                )
                | {
                    family,
                    taskRoleArn,
                    executionRoleArn,
                    networkMode,
                    containerDefinitions,
                    volumes,
                    placementConstraints,
                    requiresCompatibilities,
                    cpu,
                    memory,
                    runtimePlatform,
                    ephemeralStorage
                  }
                | with_entries(select(.value != null))
              ' "${current_json}" > "${next_json}"

            aws ecs register-task-definition \
              --cli-input-json "file://${next_json}" \
              --query taskDefinition.taskDefinitionArn \
              --output text
          }

          WEB_TASK_DEF_ARN="$(register_task_definition "${ENV_PREFIX}-web" web "${WEB_IMAGE}")"
          API_TASK_DEF_ARN="$(register_task_definition "${ENV_PREFIX}-api" api "${API_IMAGE}")"
          MCP_TASK_DEF_ARN="$(register_task_definition "${ENV_PREFIX}-mcp" mcp "${MCP_IMAGE}")"

          {
            echo "WEB_TASK_DEF_ARN=${WEB_TASK_DEF_ARN}"
            echo "API_TASK_DEF_ARN=${API_TASK_DEF_ARN}"
            echo "MCP_TASK_DEF_ARN=${MCP_TASK_DEF_ARN}"
          } >> "$GITHUB_ENV"

      - name: Run database migration and seed
        shell: bash
        run: |
          set -euo pipefail

          run_mcp_task() {
            local label="$1"
            shift

            local command_json
            command_json="$(printf '%s\n' "$@" | jq -R . | jq -sc .)"

            local overrides
            overrides="$(jq -nc \
              --arg container "mcp" \
              --argjson command "${command_json}" \
              '{containerOverrides:[{name:$container,command:$command}]}')"

            local run_output
            run_output="$(aws ecs run-task \
              --cluster "${CLUSTER}" \
              --task-definition "${MCP_TASK_DEF_ARN}" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
              --overrides "${overrides}" \
              --output json)"

            local failures
            failures="$(echo "${run_output}" | jq '.failures | length')"
            if [ "${failures}" != "0" ]; then
              echo "${run_output}" | jq '.failures' >&2
              exit 1
            fi

            local task_arn
            task_arn="$(echo "${run_output}" | jq -r '.tasks[0].taskArn')"
            if [ -z "${task_arn}" ] || [ "${task_arn}" = "null" ]; then
              echo "Failed to start ${label} task." >&2
              echo "${run_output}" >&2
              exit 1
            fi

            aws ecs wait tasks-stopped --cluster "${CLUSTER}" --tasks "${task_arn}"

            local task_desc
            task_desc="$(aws ecs describe-tasks \
              --cluster "${CLUSTER}" \
              --tasks "${task_arn}" \
              --output json)"

            # Prefer an explicit success check. An empty/null exitCode (no
            # "mcp" container, or ECS never recorded one) must not be treated
            # the same as a non-zero failure — both fail the deploy, but with
            # different diagnostics so CloudWatch/task dumps are actionable.
            local exit_code
            exit_code="$(echo "${task_desc}" | jq -r '
              .tasks[0].containers[]
              | select(.name == "mcp")
              | .exitCode
              | if . == null then empty else tostring end
            ')"

            if [ -z "${exit_code}" ]; then
              echo "${label} task: could not read mcp container exit code." >&2
              echo "${task_desc}" | jq '.tasks[0].containers // .tasks[0]' >&2
              exit 1
            fi

            if [ "${exit_code}" != "0" ]; then
              echo "${label} task failed with exit code ${exit_code}." >&2
              echo "${task_desc}" | jq '.tasks[0].containers[] | select(.name == "mcp")' >&2
              # Best-effort: print the container's own stdout so seed/migrate
              # ContentSeedError messages show up in the Actions log.
              local task_id
              task_id="$(echo "${task_arn}" | awk -F/ '{print $NF}')"
              aws logs get-log-events \
                --log-group-name "/ecs/${ENV_PREFIX}-mcp" \
                --log-stream-name "mcp/mcp/${task_id}" \
                --limit 100 \
                --query 'events[].message' \
                --output text >&2 || true
              exit 1
            fi
          }

          run_mcp_task "database migration" pnpm --filter @ai-catalyst/db run migrate
          # Content constants are the desired catalog. Curriculum edits that
          # retire a Module key (e.g. Proof → Solution) archive the old row;
          # --allow-archive is the seed CLI's confirmation for that write.
          # Local `pnpm db:seed` still requires the flag so accidental archives
          # stay hard to do by default.
          run_mcp_task "database seed" pnpm --filter @ai-catalyst/services run seed -- --allow-archive

      - name: Update ECS services
        shell: bash
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${ENV_PREFIX}-web" \
            --task-definition "${WEB_TASK_DEF_ARN}" \
            --no-cli-pager

          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${ENV_PREFIX}-api" \
            --task-definition "${API_TASK_DEF_ARN}" \
            --no-cli-pager

          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${ENV_PREFIX}-mcp" \
            --task-definition "${MCP_TASK_DEF_ARN}" \
            --no-cli-pager

          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${ENV_PREFIX}-web" "${ENV_PREFIX}-api" "${ENV_PREFIX}-mcp"
