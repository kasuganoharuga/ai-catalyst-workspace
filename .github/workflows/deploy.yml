name: Deploy (manual)

# Cloud deploy readiness for Staging (develop) / Production (main).
# Does NOT auto-run on push — enable live AWS deploy later via secrets +
# GitHub Environments. Default path is dry-run (task definition render).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: dry-run (no AWS) or push (requires AWS credentials)
        required: true
        type: choice
        options:
          - dry-run
          - push
        default: dry-run

permissions:
  contents: read
  id-token: write

jobs:
  render:
    name: Render task definitions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render ECS task definitions (matrix services)
        run: node infra/aws/scripts/render-taskdef.mjs --env ${{ inputs.environment }} --all

  build:
    name: Build ${{ matrix.service }}
    needs: render
    if: inputs.mode == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, mcp]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          dockerfile="apps/${SERVICE}/Dockerfile"
          image="${ECR_REGISTRY}/ai-catalyst-${ENV_NAME}/${SERVICE}:${IMAGE_TAG}"
          docker build -f "$dockerfile" -t "$image" .
          docker push "$image"
          echo "Pushed $image"
