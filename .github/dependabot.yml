version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        dependency-type: "production"
        patterns:
          - "next"
          - "react"
          - "react-dom"
      frontend-tooling:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "eslint*"
          - "tailwindcss"
          - "typescript"
      workspace-tooling:
        dependency-type: "development"
        patterns:
          - "concurrently"

  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    groups:
      api-python:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      web-docker:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    groups:
      api-docker:
        patterns:
          - "*"
