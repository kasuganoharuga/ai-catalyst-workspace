version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Upgrade framework/tooling majors deliberately after Next.js/ESLint support is confirmed.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-runtime:
        dependency-type: "production"
        patterns:
          - "next"
          - "react"
          - "react-dom"
      frontend-tooling:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "eslint*"
          - "tailwindcss"
          - "typescript"
      workspace-tooling:
        dependency-type: "development"
        patterns:
          - "concurrently"

  - package-ecosystem: "pip"
    directory: "/apps/api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      api-python:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # Keep the base image aligned with CI/local Python; upgrade majors deliberately.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
        versions: [">=3.12"]
    groups:
      api-docker:
        patterns:
          - "*"
